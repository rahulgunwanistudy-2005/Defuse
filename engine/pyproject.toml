[project]
name = "defuse"
version = "0.1.0"
description = "Worm containment for GitLab CI: exposure graph, safe-order planner, child-pipeline executor."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx[http2]>=0.27",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "typer>=0.12",
  "structlog>=24.1",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "semantic-version>=2.10",
  "pyyaml>=6.0",
  "google-auth>=2.30",
]

[project.optional-dependencies]
gcp = ["opentelemetry-exporter-gcp-trace>=1.6"]

[project.scripts]
defuse = "defuse.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "respx>=0.21",
  "mypy>=1.10",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
  "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["defuse"]

[tool.hatch.build.targets.wheel.force-include]
"defuse/data/sandbox_routes.json" = "defuse/data/sandbox_routes.json"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "C4", "PL"]
# PLC0415: lazy imports keep CLI startup fast and avoid heavy API deps at import time.
extend-ignore = ["PLC0415"]
# S105/S106 flag every identifier containing "token" or "secret"; this codebase is about them.
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S108"]
"defuse/store/migrations/**" = ["E501", "PLC0415"]
# FastAPI reads dependencies from call-expression defaults; that is the framework idiom.
"defuse/api/app.py" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["defuse", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["semantic_version.*", "google.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a live Postgres (DEFUSE_TEST_DATABASE_URL)"]

[tool.coverage.run]
source = ["defuse"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
