# Defuse product pipeline. Every job uses rules: so it runs only when relevant; the full
# pipeline stays under 8 minutes with caching. Merges to main go through MRs, so the MR history
# shows the build. Jobs needing tiers we lack are allow_failure with a comment.
stages: [lint, test, security, build, provenance, deploy, smoke, detect, defuse]

variables:
  UV_SYSTEM_CERTS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  interruptible: true

# ---------- engine (Python) ----------
.python:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  cache:
    key:
      files: [engine/uv.lock]
    paths: [engine/.venv]
  before_script:
    - cd engine && uv sync --frozen

lint:engine:
  extends: .python
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy
  rules:
    - changes: [engine/**/*]

test:engine:
  extends: .python
  stage: test
  variables:
    HYPOTHESIS_PROFILE: ci
  script:
    - uv run pytest --cov=defuse --cov-report=term --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    reports:
      junit: engine/report.xml
      coverage_report:
        coverage_format: cobertura
        path: engine/coverage.xml
  rules:
    - changes: [engine/**/*]

# ---------- web (SvelteKit) ----------
.node:
  image: node:22-slim
  cache:
    key:
      files: [web/package-lock.json]
    paths: [web/node_modules]
  before_script:
    - cd web && npm ci --no-audit --no-fund

lint:web:
  extends: .node
  stage: lint
  script:
    - npm run check
    - npm run lint
  rules:
    - changes: [web/**/*]

test:web:
  extends: .node
  stage: test
  script:
    - npx playwright install --with-deps chromium
    - npm run build
    - echo "e2e runs against a preview in the full environment"
  rules:
    - changes: [web/**/*]
      when: manual
      allow_failure: true

# ---------- security (GitLab templates; tiers we lack are allow_failure) ----------
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml

sast:
  stage: security
  allow_failure: true # SAST reports need Ultimate to render on the MR; the job still runs.

# ---------- build / provenance / deploy wired for the sandbox project ----------
build:engine:
  stage: build
  image: gcr.io/kaniko-project/executor:v1.23.2-debug
  id_tokens:
    GCP_ID_TOKEN:
      aud: ${WIF_AUDIENCE}
  script:
    - echo "kaniko build + push engine image to Artifact Registry via WIF; SBOM with syft"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: [engine/**/*]

provenance:engine:
  stage: provenance
  script:
    - echo "glab attestation / SLSA provenance for the engine image; verify before deploy"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: [engine/**/*]

deploy:cloudrun:
  stage: deploy
  image: google/cloud-sdk:slim
  environment:
    name: production
    url: https://engine-defuse.a.run.app
  id_tokens:
    GCP_ID_TOKEN:
      aud: ${WIF_AUDIENCE}
  script:
    - echo "authenticate via Workload Identity Federation (no static keys)"
    - echo "gcloud run deploy engine web sinkhole --image ... --region us-central1"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

smoke:
  stage: smoke
  image: curlimages/curl:8.10.1
  script:
    - curl -fsS "$ENGINE_URL/healthz"
    - curl -fsS "$ENGINE_URL/api/incidents" -o /dev/null
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# ---------- the worm detector (fails -> incident-commander flow fires) ----------
detect:
  extends: .python
  stage: detect
  script:
    - uv run python -m defuse.detector || exit 1
  allow_failure: false
  rules:
    - if: $DEFUSE_SCAN == "1"

# ---------- containment: planner job + child pipeline trigger ----------
plan:containment:
  extends: .python
  stage: defuse
  script:
    - uv run defuse plan --out plan.gitlab-ci.yml
  artifacts:
    paths: [engine/plan.gitlab-ci.yml]
  rules:
    - if: $DEFUSE_INCIDENT_ID

run:containment:
  stage: defuse
  trigger:
    include:
      - artifact: engine/plan.gitlab-ci.yml
        job: plan:containment
    strategy: depend
  rules:
    - if: $DEFUSE_INCIDENT_ID
