# Build and verification only. Hosting/deployment is intentionally outside this pipeline.
stages: [lint, test, build, security, provenance, detect, intake, defuse, record]
variables:
  UV_SYSTEM_CERTS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  DOCKER_TLS_CERTDIR: /certs
  CS_IMAGE: $CI_REGISTRY_IMAGE/engine:$CI_COMMIT_SHORT_SHA
default:
  interruptible: true
.python:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  cache:
    key:
      files: [engine/uv.lock]
    paths: [engine/.venv]
  before_script:
    - cd engine && uv sync --frozen
lint:engine:
  extends: .python
  stage: lint
  script:
    - uv run ruff check . ../sinkhole/app.py
    - uv run ruff format --check . ../sinkhole/app.py
    - uv run mypy
    - uv run python ../scripts/ci_validate_incidents.py
    - uv run python -m defuse.automate.flow_config --check
  rules:
    - changes: [engine/**/*, sinkhole/**/*, incidents/**/*, .gitlab/**/*, scripts/**/*]
test:engine:
  extends: .python
  stage: test
  variables:
    HYPOTHESIS_PROFILE: ci
  script:
    - uv run pytest --cov=defuse --cov-fail-under=75 --cov-report=xml:coverage.xml --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: engine/report.xml
      coverage_report:
        coverage_format: cobertura
        path: engine/coverage.xml
  rules:
    - changes: [engine/**/*, sinkhole/**/*]
.node:
  image: node:22-bookworm-slim
  cache:
    key:
      files: [web/package-lock.json]
    paths: [web/node_modules]
  before_script:
    - cd web && npm ci --ignore-scripts --no-audit --no-fund
lint:web:
  extends: .node
  stage: lint
  script: [npm run check, npm run lint]
  rules:
    - changes: [web/**/*]
test:web:
  extends: .node
  stage: test
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - cd engine && uv sync --frozen && cd ../web
    - npm ci --ignore-scripts --no-audit --no-fund
  script:
    - npx playwright install --with-deps chromium
    - npm test
  artifacts:
    when: always
    paths: [web/test-results/]
  rules:
    - changes: [web/**/*, engine/**/*]
test:simulator:
  extends: .node
  stage: test
  before_script: []
  script: [node simulator/selftest.js]
  rules:
    - changes: [simulator/**/*]
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml
sast:
  stage: security
  allow_failure: true # Report display depends on the GitLab tier.
container_scanning:
  stage: security
  allow_failure: true
  rules:
    - if: $DEFUSE_BUILD_IMAGES == "1"
build:images:
  stage: build
  image: docker:27-cli
  services: [docker:27-dind]
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - IMAGE_PREFIX="$CI_REGISTRY_IMAGE" IMAGE_TAG="$CI_COMMIT_SHORT_SHA" BUILD_OUTPUT=--push sh scripts/build-images.sh
  artifacts:
    paths: [build-evidence/]
  rules:
    - if: $DEFUSE_BUILD_IMAGES == "1"
provenance:verify:
  stage: provenance
  image: docker:27-cli
  needs: [build:images]
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - sh scripts/verify-images.sh
  rules:
    - if: $DEFUSE_BUILD_IMAGES == "1"
detect:
  extends: .python
  stage: detect
  script: [uv run python -m defuse.detector ..]
  rules:
    - if: $DEFUSE_SCAN == "1" && $DEFUSE_CLEAN_REBUILD != "1"
flow:headless:
  stage: intake
  image: $DEFUSE_EXECUTOR_IMAGE
  script:
    - defuse workflow flow "$DEFUSE_FLOW_REQUEST" --run --output flow-output.json
  artifacts:
    paths: [flow-output.json]
  rules:
    - if: $DEFUSE_FLOW_REQUEST
hook:diff-guard:
  extends: .python
  stage: lint
  script:
    - test -n "$DEFUSE_HOOK_ALLOWLIST" && test -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
    - uv run python ../scripts/ci_diff_guard.py --allowlist "$DEFUSE_HOOK_ALLOWLIST" --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
  rules:
    - if: $DEFUSE_HOOK_SWEEPER == "1"
plan:containment:
  extends: .python
  stage: defuse
  script:
    - uv run defuse workflow prepare "$(uv run python ../scripts/ci_select_incident.py)" plan.gitlab-ci.yml
  artifacts:
    paths: [engine/plan.gitlab-ci.yml]
  rules:
    - if: $DEFUSE_INCIDENT_REQUEST && $DEFUSE_CLEAN_REBUILD != "1"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEFUSE_CLEAN_REBUILD != "1"
      changes: [incidents/**/request.json]
run:containment:
  stage: defuse
  trigger:
    include:
      - artifact: engine/plan.gitlab-ci.yml
        job: plan:containment
    strategy: depend
  rules:
    - if: $DEFUSE_INCIDENT_REQUEST && $DEFUSE_CLEAN_REBUILD != "1"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DEFUSE_CLEAN_REBUILD != "1"
      changes: [incidents/**/request.json]
postmortem:
  stage: record
  image: $DEFUSE_EXECUTOR_IMAGE
  script:
    - defuse workflow postmortem "$DEFUSE_INCIDENT_ID" "$DEFUSE_RECORD_PROJECT_ID"
  rules:
    - if: $DEFUSE_INCIDENT_ID && $DEFUSE_RECORD_PROJECT_ID && $DEFUSE_CLEAN_REBUILD != "1"
flow:apply:
  stage: intake
  image: $DEFUSE_EXECUTOR_IMAGE
  needs: [flow:headless]
  script:
    - defuse workflow apply-flow "$DEFUSE_FLOW_REQUEST" flow-output.json
  artifacts:
    when: always
    paths: [records/]
  rules:
    - if: $DEFUSE_FLOW_REQUEST
